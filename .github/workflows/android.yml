# Builds the Android APK in the cloud. No Android tools needed on your PC.
# Set a repository variable named BACKEND_URL to your hosted backend link,
# for example https://municipal-emergency-app.onrender.com
# Then run this workflow. The APK appears as a downloadable artifact.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Set backend URL in Capacitor config
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "ERROR: set a repository variable named BACKEND_URL to your hosted backend link."
            exit 1
          fi
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.server.url=process.env.BACKEND_URL;fs.writeFileSync(p,JSON.stringify(c,null,2));console.log('backend url set to',c.server.url)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: town-emergency-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
