<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin tools</title>
  <meta name="theme-color" content="#0b5563">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="topbar"><div id="topbar"></div></div>
  <div class="tabs"><div class="inner" id="tabbar"></div></div>

  <div class="container">
    <div id="msg"></div>

    <section id="pane-broadcast" class="pane">
      <div class="card mid">
        <h1 data-i18n="broadcast.heading">Send a town warning</h1>
        <div class="field">
          <label for="bc-title">Title</label>
          <input type="text" id="bc-title" placeholder="Short headline">
        </div>
        <div class="field">
          <label for="bc-message" data-i18n="broadcast.message">Message</label>
          <textarea id="bc-message" data-i18n-ph="broadcast.message.ph"></textarea>
        </div>
        <div class="field">
          <label for="bc-severity" data-i18n="broadcast.severity">Alert level</label>
          <select id="bc-severity">
            <option value="standard" data-i18n="sev.standard">Standard</option>
            <option value="time_sensitive" data-i18n="sev.time_sensitive">Time sensitive</option>
            <option value="critical" data-i18n="sev.critical">Critical</option>
          </select>
        </div>
        <div class="field" id="bc-distance-field" style="display:none">
          <label for="bc-distance" data-i18n="broadcast.distance">Alert radius in km</label>
          <input type="number" id="bc-distance" min="0.1" step="0.1" value="1">
        </div>
        <div class="field">
          <label data-i18n="broadcast.pin">Map pin (optional)</label>
          <div class="hint" data-i18n="broadcast.pinhint"></div>
          <div id="bc-map" style="height:240px;margin-top:8px"></div>
          <div class="btn-row" style="margin-top:8px">
            <span class="subtle" id="bc-pin-text"></span>
            <button class="btn small secondary" id="bc-clear-pin" data-i18n="broadcast.clearpin">Clear pin</button>
          </div>
        </div>
        <button class="btn full" id="bc-send" data-i18n="common.send">Send</button>
      </div>
    </section>

    <section id="pane-accounts" class="pane hidden">
      <div class="card" id="demo-reset-card" hidden>
        <div class="row-between">
          <div><strong>Demo data</strong><div class="subtle">Restore the original demo accounts and sample reports.</div></div>
          <button class="btn secondary" id="reset-demo" data-i18n="demo.reset">Reset demo data</button>
        </div>
      </div>

      <div class="card">
        <h1 data-i18n="accounts.heading">Accounts</h1>
        <p class="subtle">Roles above resident are set here. This is the only place a role can be granted.</p>
        <div id="accounts-list"></div>
      </div>
    </section>

    <section id="pane-audit" class="pane hidden">
      <div class="card">
        <h1 data-i18n="audit.heading">Audit log</h1>
        <div id="audit-list"></div>
      </div>
    </section>
  </div>

  <script src="/vendor/leaflet.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/page-admin.js"></script>
</body>
</html>
