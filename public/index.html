<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Municipal Emergency Reporting</title>
  <meta name="theme-color" content="#0b5563">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="topbar"><div id="topbar"></div></div>

  <div class="container narrow">
    <div class="card">
      <h1 data-i18n="login.heading">Sign in</h1>
      <p class="subtle" data-i18n="login.tagline">Together for a safer community</p>

      <div id="msg"></div>

      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" autocomplete="username" placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button class="btn full" id="login-btn" data-i18n="login.submit">Sign in</button>

      <hr class="divider">
      <a href="/register" data-i18n="login.register">Create a resident account</a>

      <div class="demo-box" id="demo-box" hidden>
        <h3>Demo access <span class="demo-flag">demo</span></h3>
        <p class="subtle" id="demo-note"></p>
        <div class="demo-grid" id="demo-buttons"></div>
      </div>
    </div>
  </div>

  <div class="footer"><div class="inner">
    <span>Demonstration build. Not connected to real emergency services.</span>
    <span class="spacer"></span>
    <a href="/terms">Terms and Conditions</a>
    <a href="/privacy">Privacy Policy</a>
  </div></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/page-login.js"></script>
</body>
</html>
